{% extends "base.html" %}
{% block content %}

<div class="page-header">
    <h2>TAMPERING DEMONSTRATION</h2>
    <p>Upload a valid .enc file to test AES-GCM modification detection.</p>
</div>

<div class="action-container">
    <form method="POST" action="{{ url_for('main.demo_tamper') }}" enctype="multipart/form-data" id="tamperForm">
        <div class="upload-box alert-box" id="dropZoneTamper">
            <div class="upload-icon"><i class="fa-solid fa-flask"></i></div>
            <p class="upload-title">UPLOAD .ENC FOR TAMPERING</p>
            <p class="upload-sub">System will flip 1 byte of data</p>
            <input type="file" name="file" id="tamperFileInput" class="file-input" accept=".enc" required>
        </div>

        <div id="tamperFileInfo" class="file-info" style="display: none;">
            <span id="tamperFileName" class="file-name"><i class="fa-solid fa-file"></i> <span></span></span>
        </div>

        <div class="password-group">
            <label><i class="fa-solid fa-key"></i> File Password:</label>
            <div class="password-input-wrap">
                <input 
                    type="password" 
                    name="password" 
                    id="tamperPassword" 
                    class="cyber-input" 
                    placeholder="Enter file password" 
                    required
                >
                <button type="button" class="toggle-pass" data-target="tamperPassword" aria-label="Show password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn btn-danger btn-block" id="tamperBtn" disabled style="margin-top: 1.5rem;">
            <i class="fa-solid fa-skull"></i> RUN TAMPER TEST
        </button>
    </form>
</div>

{% endblock %}
